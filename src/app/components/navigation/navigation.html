<aside class="sidebar glass-panel">
  <!-- Brand Logo -->
  <div class="sidebar-brand">
    <span class="brand-icon">⚡</span>
    <span class="brand-text">CorePortal</span>
  </div>

  <!-- User Profile Card -->
  <div class="sidebar-user" *ngIf="currentUser()">
    <div class="avatar-circle">
      {{ currentUser()?.fullName?.charAt(0) || 'U' }}
    </div>
    <div class="user-info">
      <div class="user-name">{{ currentUser()?.fullName }}</div>
      <div class="user-role">{{ currentUser()?.role | uppercase }}</div>
    </div>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="9" rx="1" />
        <rect x="14" y="3" width="7" height="5" rx="1" />
        <rect x="14" y="12" width="7" height="9" rx="1" />
        <rect x="3" y="16" width="7" height="5" rx="1" />
      </svg>
      <span class="nav-label">Dashboard</span>
    </a>

    <a routerLink="/customers" routerLinkActive="active" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
      <span class="nav-label">Customers</span>
    </a>

    <a routerLink="/admins" routerLinkActive="active" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      </svg>
      <span class="nav-label">Administrators</span>
    </a>
  </nav>

  <!-- Logout Button -->
  <div class="sidebar-footer">
    <button class="logout-btn" (click)="onLogout()">
      <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      <span class="nav-label">Sign Out</span>
    </button>
  </div>
</aside>
